<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Royal Oak Arbeitszeit</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#2c3e50">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Arbeitszeit">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">
    <style>
        :root {
            --primary: #2c3e50;
            --success: #2ecc71;
            --warning: #f1c40f;
            --danger: #e74c3c;
            --bg: #f8f9fa;
            --card-bg: #ffffff;
            --text: #2c3e50;
            --link-color: #3498db;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding: 8px; display: flex; justify-content: center; min-height: 100dvh; }
        .container { width: 100%; max-width: 460px; background: var(--card-bg); border-radius: 16px; padding: 14px; box-shadow: 0 8px 16px rgba(0,0,0,0.05); position: relative; }
        h1 { font-size: 16px; text-align: center; margin-bottom: 8px; color: var(--primary); font-weight: 800; letter-spacing: 0.3px; }

        .status-badge { text-align: center; padding: 6px; border-radius: 8px; font-weight: bold; margin-bottom: 8px; background: #eee; font-size: 13px; }
        .status-bereit { background: #e0e0e0; }
        .status-arbeit { background: #d4edda; color: #155724; }
        .status-pause { background: #fff3cd; color: #856404; }
        .status-feierabend { background: #cce5ff; color: #004085; }

        .btn-link { background-color: transparent; border: 1.5px solid var(--link-color); color: var(--link-color); text-decoration: none; display: block; text-align: center; padding: 7px; border-radius: 9px; font-size: 12px; font-weight: bold; margin-bottom: 8px; }

        .display-section { text-align: center; }
        .time-box { font-size: 34px; font-weight: 700; margin: 1px 0; font-variant-numeric: tabular-nums; line-height: 1.1; }
        .overtime { color: var(--success); }
        .sub-info { font-size: 11px; color: #7f8c8d; }

        .progress-container { width: 100%; background-color: #e9ecef; height: 6px; border-radius: 3px; margin: 8px 0 10px; overflow: hidden; }
        .progress-bar { width: 0%; height: 100%; background-color: var(--link-color); transition: width 0.5s ease, background-color 0.5s ease; }

        /* Zeit-Karten — antippen zum manuellen Bearbeiten */
        .info-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 10px; font-size: 11px; }
        .info-card { background: #f1f3f5; padding: 7px 4px; border-radius: 8px; text-align: center; position: relative; cursor: pointer; -webkit-tap-highlight-color: rgba(52,152,219,0.2); }
        .info-card:active { background: #e2e6ea; }
        .info-card span { display: block; font-weight: bold; font-size: 14px; margin-top: 2px; }
        .info-card::after { content: "\270E"; position: absolute; top: 2px; right: 5px; font-size: 9px; color: #adb5bd; }
        .inline-input { width: 100%; margin-top: 2px; font-size: 14px; font-weight: bold; text-align: center; border: 1px solid var(--link-color); border-radius: 6px; padding: 1px 2px; background: #fff; color: var(--text); }

        .btn { width: 100%; padding: 11px; border: none; border-radius: 10px; font-size: 15px; font-weight: bold; color: white; cursor: pointer; margin-bottom: 7px; transition: opacity 0.2s; }
        .btn-start { background-color: var(--success); }
        .btn-pause { background-color: var(--warning); color: #333; }
        .btn-stop { background-color: var(--danger); }
        .btn-disabled { opacity: 0.15; cursor: not-allowed; pointer-events: none; }

        .footer-row { display: flex; gap: 10px; margin-top: 4px; }
        .btn-mini { flex: 1; background-color: transparent; border: none; color: #bdc3c7; font-size: 11px; cursor: pointer; text-decoration: underline; padding: 2px; }

        .overlay { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(255,255,255,0.85); display:flex; justify-content:center; align-items:center; z-index:100; font-weight:bold; font-size:14px; color: var(--primary); }
        .config-warning { background: #fff3cd; color: #856404; padding: 10px; border-radius: 8px; margin-bottom: 10px; font-size: 12px; line-height: 1.4; }
    </style>
</head>
<body>

<div id="loadingOverlay" class="overlay">⏳ Synchronisiere...</div>

<div class="container">
    <h1>Royal Oak Arbeitszeit</h1>

    <div id="configWarning" class="config-warning" style="display:none">
        ⚠️ <b>API-URL fehlt.</b> Bitte am Anfang von <code>index.html</code> die <code>API_URL</code> auf die Apps-Script-Deployment-URL setzen.
    </div>

    <div id="statusBadge" class="status-badge status-bereit">Lade...</div>

    <a id="btnAPTime" href="#" target="_blank" class="btn-link">🌐 AP Time öffnen</a>

    <div class="display-section">
        <div id="countdownLabel" style="font-size: 12px; color: #7f8c8d;">Verbleibende Sollzeit:</div>
        <div id="mainTimer" class="time-box">08:25:00</div>
        <div class="sub-info">Gearbeitet <span id="lblRealeZeit">00:00</span> · Feierabend <span id="lblFeierabend">--:--</span></div>
    </div>

    <div class="progress-container">
        <div id="progressBar" class="progress-bar"></div>
    </div>

    <!-- Antippen = Zeit manuell eintragen / korrigieren -->
    <div class="info-grid">
        <div class="info-card" id="cardKommen">Kommen<span id="lblKommen">--:--</span></div>
        <div class="info-card" id="cardPause">Pause<span id="lblPause">45 Min</span></div>
        <div class="info-card" id="cardGehen">Gehen<span id="lblGehen">--:--</span></div>
    </div>

    <button id="btnKommen" class="btn btn-start btn-disabled">Arbeitsbeginn (Kommen)</button>
    <button id="btnPause" class="btn btn-pause btn-disabled">Pause starten</button>
    <button id="btnGehen" class="btn btn-stop btn-disabled">Feierabend (Gehen)</button>

    <div class="footer-row">
        <button id="btnNotify" class="btn-mini">🔔 Benachrichtigungen</button>
        <button id="btnReset" class="btn-mini">System-Reset</button>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-messaging-compat.js"></script>
<script>
// ==============================================================
// CONFIG — alle Einstellungen hier anpassen
// ==============================================================

// ----- Verbindung zum Backend -----
// Nach Apps-Script-Deployment hier die /exec-URL einfügen
const API_URL = "https://script.google.com/macros/s/AKfycbz22FEAIA51dl8OMnqcSMtR_q293ALfLrTUKPIvuzL5o9r74Sa1odQoHCwLTKEBW4TWYA/exec";

// ----- Externer Link (AP Time Button) -----
const AP_TIME_URL = "https://aptime.cloud-horoquartz.fr";

// ----- Sollarbeitszeit pro Tag -----
const SOLL_STUNDEN = 8;
const SOLL_MINUTEN = 25;

// ----- Pause (Eingabegrenzen beim manuellen Bearbeiten) -----
const PAUSE_STANDARD_MINUTEN = 45;    // Voreinstellung an neuem Tag
const PAUSE_MIN_MINUTEN = 30;
const PAUSE_MAX_MINUTEN = 120;
const PAUSE_SCHRITT_MINUTEN = 5;

// ----- Erinnerungen -----
// Alle Erinnerungs-Einstellungen (Zeitfenster, ein/aus) leben jetzt im
// Apps-Script-Backend (Code.gs) — der Server prüft alle 5 Minuten und
// verschickt Push-Benachrichtigungen, unabhängig davon, ob die App
// geöffnet ist. Hier muss nichts mehr eingestellt werden.

// ----- Firebase Cloud Messaging (Push-Benachrichtigungen) -----
// Werte aus der Firebase-Konsole: Projekteinstellungen → Allgemein
// (Web-App) bzw. → Cloud Messaging (Web-Push-Zertifikat / VAPID-Key)
const FIREBASE_CONFIG = {
    apiKey: "AIzaSyAI7QDajLx4cNY8iU5BD2EQRZY7Li8dsF0",
    authDomain: "badging-e9359.firebaseapp.com",
    projectId: "badging-e9359",
    storageBucket: "badging-e9359.firebasestorage.app",
    messagingSenderId: "1395544088",
    appId: "1:1395544088:web:c0bb8595f906a77065736d"
};
const FIREBASE_VAPID_KEY = "BLoMX46wlGtFYhDYDqxJfzNDlOfCcH1Pinz8wadCCc1oCtwcsdz0citDA8du2wy_VAF-OSMZ9lRRaQ7fbQU1D_E";

// ==============================================================
// AB HIER NICHTS MEHR ÄNDERN
// ==============================================================

const SOLL_MILLISEKUNDEN = (SOLL_STUNDEN * 60 + SOLL_MINUTEN) * 60 * 1000;
const CLIENT_HEUTE_STR = new Date().toDateString();

let state = {
    status: 'BEREIT',
    kommenZeit: null,
    gehenZeit: null,
    geplantePauseMinuten: PAUSE_STANDARD_MINUTEN,
    realePauseMs: 0,
    uiPauseStartZeit: null
};

const btnKommen = document.getElementById('btnKommen');
const btnPause = document.getElementById('btnPause');
const btnGehen = document.getElementById('btnGehen');
const btnReset = document.getElementById('btnReset');
const btnNotify = document.getElementById('btnNotify');
const btnAPTime = document.getElementById('btnAPTime');
const cardKommen = document.getElementById('cardKommen');
const cardPause = document.getElementById('cardPause');
const cardGehen = document.getElementById('cardGehen');
const mainTimer = document.getElementById('mainTimer');
const progressBar = document.getElementById('progressBar');
const lblKommen = document.getElementById('lblKommen');
const lblGehen = document.getElementById('lblGehen');
const lblFeierabend = document.getElementById('lblFeierabend');
const lblRealeZeit = document.getElementById('lblRealeZeit');
const lblPause = document.getElementById('lblPause');
const statusBadge = document.getElementById('statusBadge');
const countdownLabel = document.getElementById('countdownLabel');
const loadingOverlay = document.getElementById('loadingOverlay');
const configWarning = document.getElementById('configWarning');

// AP Time Link aus Config
btnAPTime.href = AP_TIME_URL;

// =============================================================
// API HELPER — talks to Apps Script via fetch
// =============================================================
async function apiCall(action, extraParams = {}) {
    if (!API_URL || API_URL.startsWith("PASTE_")) {
        throw new Error("API_URL nicht konfiguriert");
    }
    const url = new URL(API_URL);
    url.searchParams.set('action', action);
    url.searchParams.set('date', CLIENT_HEUTE_STR);
    for (const [k, v] of Object.entries(extraParams)) {
        url.searchParams.set(k, v);
    }
    const response = await fetch(url.toString(), {
        method: 'GET',
        redirect: 'follow'
    });
    if (!response.ok) {
        throw new Error("HTTP " + response.status);
    }
    const data = await response.json();
    if (data && data.error) {
        throw new Error(data.error);
    }
    return data;
}

// =============================================================
// Page lifecycle
// =============================================================
window.addEventListener('load', async () => {
    if (!API_URL || API_URL.startsWith("PASTE_")) {
        configWarning.style.display = 'block';
        loadingOverlay.style.display = 'none';
        return;
    }
    await initialisiereZustandVonServer();
    setInterval(updateTicker, 1000);

    if ('serviceWorker' in navigator) {
        try {
            await navigator.serviceWorker.register('service-worker.js');
            await navigator.serviceWorker.ready;
        } catch (err) {
            console.warn('SW registration failed:', err);
        }
    }

    // Alle Erinnerungen laufen jetzt serverseitig als Push-Benachrichtigung
    // (siehe Code.gs). Dafür braucht der Server einen FCM-Gerätetoken.
    if (window.Notification) {
        if (Notification.permission === "granted") {
            registriereFcmToken().catch((err) => console.warn('FCM-Token-Registrierung fehlgeschlagen:', err));
        } else if (Notification.permission === "default") {
            // Automatischer Versuch beim ersten Laden. Manche Browser
            // unterdrücken das ungefragte Popup — dafür gibt es den
            // "Benachrichtigungen"-Button als Fallback.
            Notification.requestPermission().then((permission) => {
                if (permission === "granted") {
                    registriereFcmToken().catch((err) => console.warn('FCM-Token-Registrierung fehlgeschlagen:', err));
                }
            });
        }
    }
});

btnNotify.addEventListener('click', async () => {
    if (!window.Notification) {
        alert("Dieser Browser unterstützt keine Benachrichtigungen.");
        return;
    }
    const permission = await Notification.requestPermission();
    if (permission === "granted") {
        try {
            await registriereFcmToken();
            alert("Benachrichtigungen sind aktiviert.");
        } catch (err) {
            alert("Push-Registrierung fehlgeschlagen: " + (err.code || err.message || err));
        }
    } else {
        alert("Benachrichtigungen wurden nicht erlaubt.");
    }
});

async function registriereFcmToken() {
    if (!FIREBASE_CONFIG.apiKey || FIREBASE_CONFIG.apiKey.startsWith("PASTE_")) {
        throw new Error('Firebase noch nicht konfiguriert (FIREBASE_CONFIG).');
    }
    if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
    const messaging = firebase.messaging();
    const reg = await navigator.serviceWorker.ready;
    const token = await messaging.getToken({
        vapidKey: FIREBASE_VAPID_KEY,
        serviceWorkerRegistration: reg
    });
    if (!token) {
        throw new Error('Kein FCM-Token erhalten.');
    }
    await apiCall('registerToken', { token });
}

function showLoading(show) {
    loadingOverlay.style.display = show ? 'flex' : 'none';
}

function verarbeiteFehler(err) {
    console.error(err);
    alert("Verbindungsfehler: " + (err.message || err));
    showLoading(false);
}

function verarbeiteServerStatus(serverState) {
    state.status = serverState.status;
    state.kommenZeit = serverState.kommenZeit ? new Date(serverState.kommenZeit) : null;
    state.gehenZeit = serverState.gehenZeit ? new Date(serverState.gehenZeit) : null;
    state.geplantePauseMinuten = serverState.geplantePauseMinuten;
    state.realePauseMs = serverState.realePauseMs || 0;
    state.uiPauseStartZeit = serverState.uiPauseStartZeit ? new Date(serverState.uiPauseStartZeit) : null;

    // Fresh state: Frontend-Voreinstellung respektieren
    // (greift nur wenn noch nichts gestempelt wurde heute)
    if (state.status === 'BEREIT' && !state.kommenZeit) {
        state.geplantePauseMinuten = PAUSE_STANDARD_MINUTEN;
    }

    updateUIForStatus();
    showLoading(false);
}

async function initialisiereZustandVonServer() {
    showLoading(true);
    try {
        const data = await apiCall('status');
        verarbeiteServerStatus(data);
    } catch (err) {
        verarbeiteFehler(err);
    }
}

// =============================================================
// Manuelle Zeiteingabe — Karte antippen, Wert eintragen
// =============================================================
function hhmmVon(date) {
    if (!date) return "";
    const h = date.getHours().toString().padStart(2, '0');
    const m = date.getMinutes().toString().padStart(2, '0');
    return h + ":" + m;
}

function aktuellePauseMinuten() {
    if (state.realePauseMs > 0 || state.status === 'PAUSE') {
        return Math.round(berechneAngezeigtePauseMs() / 60000);
    }
    return state.geplantePauseMinuten;
}

function bearbeiteFeld(card, feld) {
    if (card.querySelector('input')) return;   // schon im Bearbeiten-Modus
    const span = card.querySelector('span');
    const input = document.createElement('input');
    input.className = 'inline-input';

    if (feld === 'pause') {
        input.type = 'number';
        input.min = PAUSE_MIN_MINUTEN;
        input.max = PAUSE_MAX_MINUTEN;
        input.step = PAUSE_SCHRITT_MINUTEN;
        input.value = aktuellePauseMinuten();
    } else {
        input.type = 'time';
        input.value = hhmmVon(feld === 'kommen' ? state.kommenZeit : state.gehenZeit);
    }

    span.style.display = 'none';
    card.appendChild(input);
    input.focus();
    if (input.showPicker) {
        try { input.showPicker(); } catch (e) { /* nicht überall unterstützt */ }
    }

    let erledigt = false;
    const beenden = async (speichern) => {
        if (erledigt) return;
        erledigt = true;
        let wert = input.value;
        input.remove();
        span.style.display = '';

        // Pause auf den erlaubten Bereich begrenzen (Tippen umgeht min/max)
        if (feld === 'pause' && wert !== "") {
            const minuten = Math.min(PAUSE_MAX_MINUTEN, Math.max(PAUSE_MIN_MINUTEN, parseInt(wert, 10)));
            if (isNaN(minuten)) { updatePauseAnzeige(); return; }
            wert = String(minuten);
        }

        if (speichern && wert !== "") {
            showLoading(true);
            try {
                const data = await apiCall('setZeit', { feld: feld, wert: wert });
                verarbeiteServerStatus(data);
            } catch (err) {
                verarbeiteFehler(err);
            }
        }
    };

    input.addEventListener('change', () => beenden(true));
    input.addEventListener('blur', () => beenden(true));
    input.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') beenden(false);
        if (e.key === 'Enter') beenden(true);
    });
}

cardKommen.addEventListener('click', () => bearbeiteFeld(cardKommen, 'kommen'));
cardPause.addEventListener('click', () => bearbeiteFeld(cardPause, 'pause'));
cardGehen.addEventListener('click', () => bearbeiteFeld(cardGehen, 'gehen'));

// =============================================================
// Buttons (Stempeln wie bisher)
// =============================================================
btnKommen.addEventListener('click', async () => {
    showLoading(true);
    try {
        const data = await apiCall('stempeln', {
            type: 'KOMMEN',
            pause: state.geplantePauseMinuten
        });
        verarbeiteServerStatus(data);
    } catch (err) { verarbeiteFehler(err); }
});

btnPause.addEventListener('click', async () => {
    showLoading(true);
    try {
        const data = await apiCall('stempeln', {
            type: state.status === 'ARBEIT' ? 'PAUSE_START' : 'PAUSE_ENDE',
            pause: state.geplantePauseMinuten
        });
        verarbeiteServerStatus(data);
    } catch (err) { verarbeiteFehler(err); }
});

btnGehen.addEventListener('click', async () => {
    showLoading(true);
    try {
        const data = await apiCall('stempeln', {
            type: 'GEHEN',
            pause: state.geplantePauseMinuten
        });
        verarbeiteServerStatus(data);
    } catch (err) { verarbeiteFehler(err); }
});

btnReset.addEventListener('click', async () => {
    if (confirm("System zurücksetzen?")) {
        showLoading(true);
        try {
            const data = await apiCall('reset');
            verarbeiteServerStatus(data);
        } catch (err) { verarbeiteFehler(err); }
    }
});

// =============================================================
// Display helpers
// =============================================================
function formatUhrzeit(date) {
    if (!date) return "--:--";
    return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

function formatDauer(ms) {
    let absolutesMs = Math.abs(ms);
    let gesamtSekunden = Math.floor(absolutesMs / 1000);
    let stunden = Math.floor(gesamtSekunden / 3600);
    let minuten = Math.floor((gesamtSekunden % 3600) / 60);
    let sekunden = gesamtSekunden % 60;
    return `${stunden.toString().padStart(2, '0')}:${minuten.toString().padStart(2, '0')}:${sekunden.toString().padStart(2, '0')}`;
}

// Tatsächlich angefallene Pause (inkl. laufender Pause)
function berechneAngezeigtePauseMs() {
    let p = state.realePauseMs;
    if (state.status === 'PAUSE' && state.uiPauseStartZeit) {
        p += (new Date() - state.uiPauseStartZeit);
    }
    return p;
}

function berechneEffektivePauseMs() {
    if (state.realePauseMs > 0 || state.status === 'PAUSE') {
        return berechneAngezeigtePauseMs();
    }
    return state.geplantePauseMinuten * 60 * 1000;
}

function berechneFeierabendUhrzeit() {
    const basisZeit = state.kommenZeit || new Date();
    const zielZeit = new Date(basisZeit.getTime() + SOLL_MILLISEKUNDEN);
    return new Date(zielZeit.getTime() + berechneEffektivePauseMs());
}

function updateFeierabendAnzeige() {
    const fZeit = berechneFeierabendUhrzeit();
    lblFeierabend.innerText = fZeit ? formatUhrzeit(fZeit) : "--:--";
}

function updatePauseAnzeige() {
    if (state.realePauseMs > 0 || state.status === 'PAUSE') {
        lblPause.innerText = Math.round(berechneAngezeigtePauseMs() / 60000) + " Min";
    } else {
        lblPause.innerText = state.geplantePauseMinuten + " Min gepl.";
    }
}

function updateBeendetAnzeige() {
    const finalePauseMs = state.realePauseMs > 0
        ? state.realePauseMs
        : state.geplantePauseMinuten * 60 * 1000;
    const endZeitpunkt = state.gehenZeit ? state.gehenZeit.getTime() : new Date().getTime();
    const bruttoArbeitszeit = endZeitpunkt - state.kommenZeit.getTime();
    const netto = bruttoArbeitszeit - finalePauseMs;
    const ueberstunden = netto - SOLL_MILLISEKUNDEN;

    lblRealeZeit.innerText = formatDauer(Math.max(0, netto)).substring(0, 5);

    if (ueberstunden >= 0) {
        mainTimer.innerText = "+" + formatDauer(ueberstunden);
        mainTimer.className = "time-box overtime";
        mainTimer.style.color = "";
    } else {
        mainTimer.innerText = "-" + formatDauer(Math.abs(ueberstunden));
        mainTimer.className = "time-box";
        mainTimer.style.color = "var(--danger)";
    }
}

function updateUIForStatus() {
    btnKommen.className = "btn btn-start btn-disabled";
    btnPause.className = "btn btn-pause btn-disabled";
    btnGehen.className = "btn btn-stop btn-disabled";
    mainTimer.style.color = "";

    lblKommen.innerText = formatUhrzeit(state.kommenZeit);
    lblGehen.innerText = formatUhrzeit(state.gehenZeit);
    updatePauseAnzeige();

    if (state.status === 'BEREIT') {
        btnKommen.className = "btn btn-start";
        statusBadge.className = "status-badge status-bereit";
        statusBadge.innerText = "Bereit für den Arbeitstag";
        mainTimer.innerText = formatDauer(SOLL_MILLISEKUNDEN);
        mainTimer.classList.remove('overtime');
        lblRealeZeit.innerText = "00:00";
        progressBar.style.width = "0%";
        progressBar.style.backgroundColor = "var(--link-color)";
        countdownLabel.innerText = "Verbleibende Sollzeit:";
        countdownLabel.style.color = "#7f8c8d";
    }
    else if (state.status === 'ARBEIT') {
        btnPause.className = "btn btn-pause";
        btnPause.innerText = "Pause starten";
        btnGehen.className = "btn btn-stop";
        statusBadge.className = "status-badge status-arbeit";
        statusBadge.innerText = "Zeiterfassung läuft...";
    }
    else if (state.status === 'PAUSE') {
        btnPause.className = "btn btn-pause";
        btnPause.innerText = "Pause beenden (Weiterarbeiten)";
        btnGehen.className = "btn btn-stop";
        statusBadge.className = "status-badge status-pause";
        statusBadge.innerText = "In der Mittagspause";
    }
    else if (state.status === 'BEENDET') {
        statusBadge.className = "status-badge status-feierabend";
        statusBadge.innerText = "Arbeitstag beendet";
        countdownLabel.innerText = "Tagesergebnis (Überstunden):";
        mainTimer.classList.remove('overtime');
        progressBar.style.width = "100%";
        progressBar.style.backgroundColor = "#34495e";
        updateBeendetAnzeige();
    }
    updateFeierabendAnzeige();
}

function updateTicker() {
    if (state.status === 'BEREIT' || state.status === 'BEENDET') return;

    const jetzt = new Date();

    // --- Pause- und Arbeitszeit-Anzeige ---
    updatePauseAnzeige();
    const anzeigeePauseMs = berechneEffektivePauseMs();
    const nettoArbeitszeitMs = (state.realePauseMs > 0 || state.status === 'PAUSE')
        ? jetzt - state.kommenZeit - anzeigeePauseMs
        : jetzt - state.kommenZeit;
    lblRealeZeit.innerText = formatDauer(Math.max(0, nettoArbeitszeitMs)).substring(0, 5);

    // --- Feierabend-Countdown ---
    updateFeierabendAnzeige();
    const feierabend = berechneFeierabendUhrzeit();
    const restZeitMs = feierabend - jetzt;

    const totalDauerMs = feierabend.getTime() - state.kommenZeit.getTime();
    const vergangenMs = jetzt.getTime() - state.kommenZeit.getTime();
    let prozent = (vergangenMs / totalDauerMs) * 100;
    if (prozent > 100) prozent = 100;
    if (prozent < 0) prozent = 0;
    progressBar.style.width = prozent + "%";

    if (restZeitMs > 0) {
        countdownLabel.innerText = "Zeit bis Feierabend:";
        countdownLabel.style.color = "#7f8c8d";
        mainTimer.innerText = formatDauer(restZeitMs);
        mainTimer.classList.remove('overtime');
        progressBar.style.backgroundColor = "var(--link-color)";
    } else {
        countdownLabel.innerText = "Überstunden angesammelt:";
        countdownLabel.style.color = "var(--success)";
        mainTimer.innerText = "+" + formatDauer(Math.abs(restZeitMs));
        mainTimer.classList.add('overtime');
        progressBar.style.backgroundColor = "gold";
    }
}
</script>
